name: Release

# A tag is the only thing that produces a download. Nothing here runs on a
# push to main: an installer built from an arbitrary commit is one somebody
# will eventually hand to a user, and there would be no way to say what is in
# it.
on:
  push:
    tags: ["v*"]
  # Buildable by hand so the packaging can be exercised without minting a
  # version. A workflow that only ever runs at release time is one whose
  # breakage is discovered at release time.
  workflow_dispatch:

permissions:
  contents: read         # the default; write is granted per job, below

jobs:
  # One job per platform, deliberately not a matrix. They differ in more than a
  # runner label — the artefact patterns, the checksum tool and what can
  # honestly be claimed about each are all different — and a matrix with three
  # sets of `if:` conditions is harder to read than three jobs that say what
  # they do.
  #
  # macOS is the only one anyone has installed and used. Windows and Linux are
  # built so those users have something to download and so breakage surfaces
  # here rather than in a bug report, but nobody has run them on real hardware.
  # That is stated in the release notes rather than left for someone to
  # discover. See ROADMAP §3f.
  macos:
    name: macOS (Apple Silicon)
    # Apple Silicon only, deliberately — see ROADMAP §3f. Every Mac sold since
    # 2020 is arm64, and Intel means a second runtime, build and test target
    # for a shrinking population. macos-14 and later are arm64 runners;
    # macos-latest has moved before and would silently change the architecture
    # of what users download, so it is pinned.
    runs-on: macos-14

    permissions:
      contents: write      # needed to attach artefacts to the release

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: The suite must pass before anything is published
        run: python3 -m unittest discover -s tests

      # Pinned to a commit, so the toolchain the branch name used to supply
      # has to be named here.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Cache the Tauri CLI
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-v2-${{ runner.os }}

      - name: Install the Tauri CLI if it is not cached
        run: |
          command -v cargo-tauri >/dev/null 2>&1 \
            || cargo install tauri-cli --version "^2.0" --locked

      - name: Fetch the pinned Python runtime
        # Verifies a recorded SHA-256 before extracting anything and fails
        # loudly on a mismatch — see tools/fetch_runtime.py.
        run: python3 tools/fetch_runtime.py

      - name: Assemble exactly what ships
        # Refuses to continue if the payload contains a config, a key, a
        # database or a CSV. That check exists because those are the user's,
        # and because the runtime tree is copied wholesale.
        run: python3 tools/stage_bundle.py

      - name: Build the app and the disk image
        working-directory: tray
        run: cargo tauri build

      - name: Record what was built
        run: |
          cd tray/target/release/bundle/dmg
          for f in *.dmg; do shasum -a 256 "$f" > "$f.sha256"; done
          echo "--- checksums ---"
          cat *.sha256

      - name: Keep the build even when there is no release to attach to
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: airo-macos-arm64
          path: |
            tray/target/release/bundle/dmg/*.dmg
            tray/target/release/bundle/dmg/*.sha256

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            tray/target/release/bundle/dmg/*.dmg
            tray/target/release/bundle/dmg/*.sha256
          fail_on_unmatched_files: true

  windows:
    name: Windows (x86_64, untested)
    runs-on: windows-latest

    permissions:
      contents: write      # needed to attach artefacts to the release

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: The suite must pass before anything is published
        run: python -m unittest discover -s tests

      # Pinned to a commit, so the toolchain the branch name used to supply
      # has to be named here.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Cache the Tauri CLI
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-tauri.exe
          key: tauri-cli-v2-${{ runner.os }}

      - name: Install the Tauri CLI if it is not cached
        shell: bash
        run: |
          command -v cargo-tauri >/dev/null 2>&1 \
            || cargo install tauri-cli --version "^2.0" --locked

      - name: Fetch the pinned Python runtime
        run: python tools/fetch_runtime.py

      - name: Assemble exactly what ships
        run: python tools/stage_bundle.py

      - name: Build the app and the installer
        working-directory: tray
        run: cargo tauri build

      - name: Record what was built
        shell: bash
        run: |
          cd tray/target/release/bundle/msi
          for f in *.msi; do sha256sum "$f" > "$f.sha256"; done
          echo "--- checksums ---"
          cat *.sha256

      - name: Keep the build even when there is no release to attach to
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: airo-windows-x86_64
          path: |
            tray/target/release/bundle/msi/*.msi
            tray/target/release/bundle/msi/*.sha256

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            tray/target/release/bundle/msi/*.msi
            tray/target/release/bundle/msi/*.sha256
          fail_on_unmatched_files: true

  linux:
    name: Linux (x86_64, untested)
    runs-on: ubuntu-22.04

    permissions:
      contents: write      # needed to attach artefacts to the release

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: The suite must pass before anything is published
        run: python3 -m unittest discover -s tests

      # Pinned to a commit, so the toolchain the branch name used to supply
      # has to be named here.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Install the system libraries Tauri links against
        # webkit2gtk and libappindicator are not on the runner by default, and
        # a tray without an indicator library builds and then has nowhere to
        # draw itself.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libgtk-3-dev libfuse2

      - name: Cache the Tauri CLI
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-v2-${{ runner.os }}

      - name: Install the Tauri CLI if it is not cached
        run: |
          command -v cargo-tauri >/dev/null 2>&1 \
            || cargo install tauri-cli --version "^2.0" --locked

      - name: Fetch the pinned Python runtime
        run: python3 tools/fetch_runtime.py

      - name: Assemble exactly what ships
        run: python3 tools/stage_bundle.py

      - name: Build the app and the packages
        working-directory: tray
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: cargo tauri build --bundles deb,appimage

      - name: Record what was built
        run: |
          cd tray/target/release/bundle
          for f in deb/*.deb appimage/*.AppImage; do
            [ -e "$f" ] || continue
            sha256sum "$f" > "$f.sha256"
          done
          echo "--- checksums ---"
          cat deb/*.sha256 appimage/*.sha256 2>/dev/null || true

      - name: Keep the build even when there is no release to attach to
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: airo-linux-x86_64
          path: |
            tray/target/release/bundle/deb/*.deb
            tray/target/release/bundle/deb/*.sha256
            tray/target/release/bundle/appimage/*.AppImage
            tray/target/release/bundle/appimage/*.sha256

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            tray/target/release/bundle/deb/*.deb
            tray/target/release/bundle/deb/*.sha256
            tray/target/release/bundle/appimage/*.AppImage
            tray/target/release/bundle/appimage/*.sha256
          fail_on_unmatched_files: true

  # Written once, after all three have attached their files, so the notes
  # cannot describe a platform whose build failed. Runs only for a tag.
  notes:
    name: Release notes
    needs: [macos, windows, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04

    permissions:
      contents: write      # needed to write the release body

    steps:
      - name: Say what each download is, and what it is not
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          # The unsigned warning is the minimum a user is owed: without it the
          # Gatekeeper block reads as malware and they stop. The untested
          # wording on Windows and Linux is the same principle — those builds
          # are produced by CI and have not been installed by anyone, and
          # letting someone find that out themselves would be worse than
          # saying so.
          body: |
            ### macOS — `Airo_*.dmg`
            **Apple Silicon (M1 and later).** Intel is not supported; see the
            README for the command-line install.

            This build is **not yet signed by Apple**. macOS will warn you the
            first time you open it. Right-click the app and choose *Open*, then
            *Open* again in the dialog. You only have to do this once.

            ### Windows — `Airo_*.msi` · Linux — `*.deb`, `*.AppImage`
            **Built, but not yet tested on real hardware.** These are produced
            by CI and have not been installed by anyone. They are published so
            you have something to try and so build breakage is caught early —
            if one does not work, the command-line install in the README does,
            and a bug report is genuinely useful.

            Windows and Linux builds are unsigned too.

            ### Verifying a download
            Every file has a `.sha256` beside it:
            `shasum -a 256 -c Airo_*.dmg.sha256` (macOS/Linux)

            A match confirms the file reached you intact, not that the build is
            trustworthy — the checksums are produced by the same workflow run
            that produced the files.
          draft: false
