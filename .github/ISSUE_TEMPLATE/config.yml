# Blank issues are off because the forms ask for the things that decide whether
# a report can be acted on — the version, the platform, what the health check
# said — and a blank box gets none of them. A report nobody can reproduce costs
# the reporter more than it costs us: they wrote it and nothing happened.
blank_issues_enabled: false

contact_links:
  - name: Report a security vulnerability
    url: https://github.com/Donnishcomau/airo/security/policy
    about: >-
      Not an issue, please — an issue is public the moment it is filed. Email
      security@donnish.com.au. SECURITY.md says what to include, what is in
      scope, and what happens next.

  - name: Questions, ideas, and "is it supposed to do that?"
    url: https://github.com/Donnishcomau/airo/discussions
    about: >-
      Discussions, for anything not yet a specific bug or a specific request.
      Asking whether something is a bug is a good use of it — the answer is
      sometimes that the reading is right and the situation is worse than you
      thought.
